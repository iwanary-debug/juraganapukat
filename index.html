<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juragan Alpukat - Pencatatan Stok & Analisis Balik Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        avocado: {
                            50: '#f4f8f3', 100: '#e5eedf', 200: '#cedfc3', 300: '#abca9d',
                            400: '#84b073', 500: '#5f914d', 600: '#48743b', 700: '#3a5d30',
                            800: '#304a29', 900: '#283e23', dark: '#1a2e16', flesh: '#e9d77b', seed: '#633918'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7faf6; }
       .bg-avocado-gradient { background: linear-gradient(135deg, #283e23 0%, #48743b 50%, #5f914d 100%); }
       .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
       .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
       .custom-scrollbar::-webkit-scrollbar-thumb { background: #abca9d; border-radius: 8px; }
       .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #5f914d; }
    </style>
</head>
<body class="text-slate-800 bg-slate-50 min-h-screen pb-12" x-data="avocadoApp()" x-init="initApp()">

    <!--... ISI HTML SAMPAIAN DARI HEADER SAMPE MODAL TETAP SAMA PERSIS... -->
    <!-- Saya potong biar ga kepanjangan. Bagian HTML sampean ga ada yg dirubah -->

    <!-- YANG DIRUBAH CUMA SCRIPT TERAKHIR INI SAJA -->
    <script type="module">
        // 1. IMPORT FIREBASE SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 2. KONFIGURASI APLIKASI
        const IS_PREVIEW = false; // UDAH DIRUBAH JADI FALSE

        // 3. PASTE FIREBASE CONFIG ANDA DI SINI - AMBIL DARI CONSOLE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBbw-HRQLkY9SntKk6IO6xA9JzYz0VqEaE",
  authDomain: "juragan-apukat.firebaseapp.com",
  projectId: "juragan-apukat",
  storageBucket: "juragan-apukat.firebasestorage.app",
  messagingSenderId: "187107540928",
  appId: "1:187107540928:web:0502dcc2826d81dde51225"
        };

        // 4. INISIALISASI FIREBASE
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function avocadoApp() {
            return {
                activeTab: 'penjualan',
                modalOpen: false,
                modalType: 'penjualan',
                searchPenjualan: '',
                searchKulakan: '',
                toast: { show: false, message: '', type: 'success' },
                batches: [], sales: [], afkirLogs: [],
                finChartObj: null, stockChartObj: null,

                formPenjualan: { tanggal: new Date().toISOString().split('T')[0], pembeli: '', jumlah: null, hargaPerKg: 35000, catatan: '' },
                formKulakan: { tanggal: new Date().toISOString().split('T')[0], supplier: '', jumlah: null, hargaBeliPerKg: 20000, catatan: '' },
                formAfkir: { tanggal: new Date().toISOString().split('T')[0], jumlah: null, alasan: '' },

                async initApp() {
                    if (IS_PREVIEW) {
                        this.loadSampleData(false); // Mode Demo pake data sampel
                    } else {
                        this.listenData(); // Mode Live, dengerin data dari Firebase
                    }
                    this.$nextTick(() => { this.renderCharts(); });
                },

                // 5. FUNGSI BARU: DENGERIN DATA DARI FIREBASE REALTIME
                listenData() {
                    onSnapshot(query(collection(db, "kulakan"), orderBy("tanggal", "desc")), (snapshot) => {
                        this.batches = snapshot.docs.map(doc => ({ id: doc.id,...doc.data() }));
                        this.updateCharts();
                    });
                    onSnapshot(query(collection(db, "penjualan"), orderBy("tanggal", "desc")), (snapshot) => {
                        this.sales = snapshot.docs.map(doc => ({ id: doc.id,...doc.data() }));
                        this.updateCharts();
                    });
                    onSnapshot(query(collection(db, "afkir"), orderBy("tanggal", "desc")), (snapshot) => {
                        this.afkirLogs = snapshot.docs.map(doc => ({ id: doc.id,...doc.data() }));
                        this.updateCharts();
                    });
                },

                // 6. SIMPAN KE FIREBASE
                async saveToFirebase(collectionName, data) {
                    await addDoc(collection(db, collectionName), data);
                },
                async deleteFromFirebase(collectionName, id) {
                    await deleteDoc(doc(db, collectionName, id));
                },

                get stats() { /*... KODE STATS SAMA PERSIS... */
                    const totalModal = this.batches.reduce((sum, b) => sum + (b.total || 0), 0);
                    const totalStokMasuk = this.batches.reduce((sum, b) => sum + (b.jumlah || 0), 0);
                    const totalPenjualan = this.sales.reduce((sum, s) => sum + (s.total || 0), 0);
                    const totalTerjual = this.sales.reduce((sum, s) => sum + (s.jumlah || 0), 0);
                    const totalAfkir = this.afkirLogs.reduce((sum, a) => sum + (a.jumlah || 0), 0);
                    const sisaStok = Math.max(0, totalStokMasuk - totalTerjual - totalAfkir);
                    const labaRugi = totalPenjualan - totalModal;
                    let persenBEP = 0; if (totalModal > 0) { persenBEP = (totalPenjualan / totalModal) * 100; } else if (totalPenjualan > 0) { persenBEP = 100; }
                    const sisaModalHarusKembali = Math.max(0, totalModal - totalPenjualan);
                    const avgHargaJual = totalTerjual > 0? (totalPenjualan / totalTerjual) : 35000;
                    const avgHargaBeli = totalStokMasuk > 0? (totalModal / totalStokMasuk) : 20000;
                    const potensiOmsetSisa = sisaStok * avgHargaJual;
                    const nilaiKerugianAfkir = totalAfkir * avgHargaBeli;
                    return { totalModal, totalStokMasuk, totalPenjualan, totalTerjual, totalAfkir, sisaStok, labaRugi, persenBEP, sisaModalHarusKembali, avgHargaJual, potensiOmsetSisa, nilaiKerugianAfkir };
                },
                get isBreakEven() { return this.stats.totalPenjualan >= this.stats.totalModal && this.stats.totalModal > 0; },
                get filteredSales() { if (!this.searchPenjualan) return this.sales; const q = this.searchPenjualan.toLowerCase(); return this.sales.filter(s => (s.pembeli && s.pembeli.toLowerCase().includes(q)) || (s.catatan && s.catatan.toLowerCase().includes(q))); },
                get filteredBatches() { if (!this.searchKulakan) return this.batches; const q = this.searchKulakan.toLowerCase(); return this.batches.filter(b => (b.supplier && b.supplier.toLowerCase().includes(q)) || (b.catatan && b.catatan.toLowerCase().includes(q))); },
                openModal(type) { this.modalType = type; this.modalOpen = true; },
                closeModal() { this.modalOpen = false; },
                showToast(msg, type = 'success') { this.toast.message = msg; this.toast.type = type; this.toast.show = true; setTimeout(() => { this.toast.show = false; }, 3500); },

                async submitPenjualan() {
                    if (this.formPenjualan.jumlah > this.stats.sisaStok) { this.showToast(`Stok tidak mencukupi! Sisa stok saat ini ${this.stats.sisaStok.toFixed(1)} Kg.`, 'error'); return; }
                    const total = this.formPenjualan.jumlah * this.formPenjualan.hargaPerKg;
                    const newSale = { tanggal: this.formPenjualan.tanggal, pembeli: this.formPenjualan.pembeli || 'Pelanggan Eceran', jumlah: Number(this.formPenjualan.jumlah), hargaPerKg: Number(this.formPenjualan.hargaPerKg), total: total, catatan: this.formPenjualan.catatan };
                    if (!IS_PREVIEW) await this.saveToFirebase("penjualan", newSale);
                    this.closeModal(); this.showToast('Penjualan berhasil dicatat!');
                    this.formPenjualan.jumlah = null; this.formPenjualan.catatan = '';
                },
                async submitKulakan() {
                    const total = this.formKulakan.jumlah * this.formKulakan.hargaBeliPerKg;
                    const newBatch = { tanggal: this.formKulakan.tanggal, supplier: this.formKulakan.supplier || 'Pengepul Lokal', jumlah: Number(this.formKulakan.jumlah), hargaBeliPerKg: Number(this.formKulakan.hargaBeliPerKg), total: total, catatan: this.formKulakan.catatan };
                    if (!IS_PREVIEW) await this.saveToFirebase("kulakan", newBatch);
                    this.closeModal(); this.showToast('Stok kulakan baru berhasil disimpan!');
                    this.formKulakan.jumlah = null; this.formKulakan.catatan = '';
                },
                async submitAfkir() {
                    if (this.formAfkir.jumlah > this.stats.sisaStok) { this.showToast(`Jumlah afkir melebihi stok yang ada (${this.stats.sisaStok.toFixed(1)} Kg)!`, 'error'); return; }
                    const newAfkir = { tanggal: this.formAfkir.tanggal, jumlah: Number(this.formAfkir.jumlah), alasan: this.formAfkir.alasan || 'Buah busuk / rusak' };
                    if (!IS_PREVIEW) await this.saveToFirebase("afkir", newAfkir);
                    this.closeModal(); this.showToast('Catatan buah afkir berhasil ditambahkan!');
                    this.formAfkir.jumlah = null; this.formAfkir.alasan = '';
                },

                async deletePenjualan(id) { if (!IS_PREVIEW) await this.deleteFromFirebase("penjualan", id); this.showToast('Data penjualan dihapus.'); },
                async deleteKulakan(id) { if (!IS_PREVIEW) await this.deleteFromFirebase("kulakan", id); this.showToast('Data kulakan dihapus.'); },
                async deleteAfkir(id) { if (!IS_PREVIEW) await this.deleteFromFirebase("afkir", id); this.showToast('Data afkir dihapus.'); },

                formatRupiah(num) { if (isNaN(num) || num === null) return 'Rp 0'; return 'Rp ' + Math.round(num).toLocaleString('id-ID'); },
                formatDate(dateStr) { if (!dateStr) return '-'; const options = { year: 'numeric', month: 'short', day: 'numeric' }; return new Date(dateStr).toLocaleDateString('id-ID', options); },

                loadSampleData(notify = true) { /*... KODE SAMPEL SAMA... */
                    const today = new Date(); const d1 = new Date(today); d1.setDate(d1.getDate() - 5); const d2 = new Date(today); d2.setDate(d2.getDate() - 3); const d3 = new Date(today); d3.setDate(d3.getDate() - 1);
                    this.batches = [{ id: 101, tanggal: d1.toISOString().split('T')[0], supplier: 'Kebun Alpukat Probolinggo', jumlah: 100, hargaBeliPerKg: 20000, total: 2000000, catatan: 'Grade Mentega Super' }, { id: 102, tanggal: d2.toISOString().split('T')[0], supplier: 'Pengepul Pasuruan (Miki)', jumlah: 50, hargaBeliPerKg: 24000, total: 1200000, catatan: 'Alpukat Miki matang pohon' }];
                    this.sales = [{ id: 201, tanggal: d1.toISOString().split('T')[0], pembeli: 'Toko Buah Segar Utama', jumlah: 35, hargaPerKg: 35000, total: 1225000, catatan: 'Grosir 35kg' }, { id: 202, tanggal: d2.toISOString().split('T')[0], pembeli: 'Resto Jus Sehat Surabaya', jumlah: 40, hargaPerKg: 38000, total: 1520000, catatan: 'Langanan bulanan' }, { id: 203, tanggal: d3.toISOString().split('T')[0], pembeli: 'Pelanggan Ecer Perumahan', jumlah: 25, hargaPerKg: 40000, total: 1000000, catatan: '25 bungkus ecer' }];
                    this.afkirLogs = [{ id: 301, tanggal: d2.toISOString().split('T')[0], jumlah: 3, alasan: 'Busuk akibat penyok kurir' }];
                    if (notify) this.showToast('Data contoh usaha berhasil dimuat!');
                },
                resetAllData() { this.batches = []; this.sales = []; this.afkirLogs = []; this.showToast('Semua data pencatatan telah direset!'); },
                renderCharts() { /*... KODE CHART SAMA... */
                    const ctxFin = document.getElementById('financialChart')?.getContext('2d'); if (ctxFin) { if (this.finChartObj) this.finChartObj.destroy(); this.finChartObj = new Chart(ctxFin, { type: 'bar', data: { labels: ['Modal Kulakan', 'Hasil Penjualan', 'Laba / (Rugi)'], datasets: [{ label: 'Nominal (Rp)', data: [this.stats.totalModal, this.stats.totalPenjualan, this.stats.labaRugi], backgroundColor: ['#f59e0b', '#10b981', this.stats.labaRugi >= 0? '#48743b' : '#ef4444'], borderRadius: 12 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { callback: (value) => 'Rp ' + (value / 1000) + 'k' } } } }); }
                    const ctxStock = document.getElementById('stockChart')?.getContext('2d'); if (ctxStock) { if (this.stockChartObj) this.stockChartObj.destroy(); this.stockChartObj = new Chart(ctxStock, { type: 'doughnut', data: { labels: ['Stok Terjual (Kg)', 'Sisa Stok Siap Jual (Kg)', 'Stok Afkir/Busuk (Kg)'], datasets: [{ data: [this.stats.totalTerjual, this.stats.sisaStok, this.stats.totalAfkir], backgroundColor: ['#10b981', '#84b073', '#ef4444'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }, cutout: '70%' }); }
                },
                updateCharts() { this.$nextTick(() => { this.renderCharts(); }); }
            }
        }
    </script>
</body>
</html>
